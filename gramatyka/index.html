<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Граматика — Deutsch mit uns</title>
<link rel="stylesheet" href="../assets/lesson-style.css">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>

<div id="siteNav"></div>
<script src="../assets/site-nav.js"></script>
<script>renderSiteNav('siteNav', { root: '../', active: 'gramatyka' });</script>

<header class="hero">
  <div class="hero-top">
    <div>
      <span class="hero-badge">ГРАМАТИКА</span>
      <h1>Граматика німецької</h1>
      <p class="sub">Правила з таблицями й прикладами та вправи на кожну тему. Спільний розділ для всіх класів: заглядай, коли щось забулося, або відпрацьовуй тему до кінця.</p>
    </div>
  </div>
</header>

<div class="site-main">
  <div class="grammar-toolbar">
    <div class="search-row">
      <input type="text" id="grammarSearch" placeholder="Пошук: Dativ, Perfekt, weil, прийменники…" autocomplete="off">
    </div>
    <label><input type="checkbox" id="grammarReadyOnly"> Лише готові теми</label>
  </div>
  <p class="grammar-summary" id="grammarSummary"></p>
  <div id="grammarToc"></div>
</div>

<footer class="site-footer">Нова тема з'являється тут одразу після того, як у data/grammar-data.js їй проставлено opublikovano.</footer>

<script src="../data/grammar-data.js"></script>
<script src="../assets/site.js"></script>
<script>
  renderGrammar();
</script>
</body>
</html>
