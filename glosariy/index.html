<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Глосарій — Deutsch mit uns</title>
<link rel="stylesheet" href="../assets/lesson-style.css">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>

<div id="siteNav"></div>
<script src="../assets/site-nav.js"></script>
<script>renderSiteNav('siteNav', { root: '../', active: 'glosariy' });</script>

<header class="hero">
  <div class="hero-top">
    <div>
      <span class="hero-badge">ГЛОСАРІЙ</span>
      <h1>Слова з усіх уроків</h1>
      <p class="sub">Один спільний список — фільтруй за класом чи модулем, або просто шукай слово.</p>
    </div>
  </div>
</header>

<div class="site-main">
  <div class="glossary-toolbar">
    <input type="text" id="glossarySearch" placeholder="Шукати слово…" autocomplete="off" style="flex:1;min-width:180px;font-family:var(--sans);font-size:14px;padding:8px 12px;border-radius:8px;border:1.5px solid var(--line);">
    <select id="filterKlas"><option value="">Усі класи</option></select>
    <select id="filterModul"><option value="">Усі модулі</option></select>
  </div>
  <p class="glossary-count" id="glossaryCount"></p>
  <div class="glossary-row head">
    <span>Німецькою</span><span>Переклад</span><span>Клас</span><span>Модуль</span>
  </div>
  <div class="glossary-list" id="glossaryList"></div>
</div>

<footer class="site-footer">Нові слова додаються сюди після кожного уроку.</footer>

<script src="../data/glossary-data.js"></script>
<script src="../assets/site.js"></script>
<script>
  renderGlossary();
</script>
</body>
</html>
