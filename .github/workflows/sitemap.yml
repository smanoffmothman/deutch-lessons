# Після кожного завантаження на GitHub:
#   1) вписує в уроки, теми, статті й сторінки підручників пошукові теги (опис, картка посилання) —
#      скрипт .github/scripts/build_seo.py, дані з data/*.js;
#   2) вписує в сторінки-списки (klasy/, gramatyka/, materialy/, pidruchnyky/, хаби книжок) статичний
#      перелік посилань для пошукових систем — .github/scripts/build_links.py, дані з data/*.js;
#   3) оновлює sitemap.xml (карту сайту) — .github/scripts/build_sitemap.py.
# Вручну нічого робити не треба. Запустити вручну: Actions → sitemap → Run workflow.
name: sitemap

on:
  push:
    branches: [main]
    paths-ignore: ['sitemap.xml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Налаштувати git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
      - name: Пошукові теги в уроках, темах, статтях і підручниках
        run: |
          python3 .github/scripts/build_seo.py
          git add -A lessons gramatyka/temy materialy/statti pidruchnyky
          git diff --cached --quiet || git commit -m "робот: пошукові теги оновлено автоматично"
      - name: Статичні посилання на сторінках-списках
        run: |
          python3 .github/scripts/build_links.py
          git add -A klasy/index.html gramatyka/index.html materialy/index.html pidruchnyky
          git diff --cached --quiet || git commit -m "робот: статичні посилання оновлено автоматично"
      - name: Зібрати sitemap.xml
        run: |
          python3 .github/scripts/build_sitemap.py
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "робот: sitemap.xml оновлено автоматично"
      - name: Відправити на GitHub
        run: |
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then echo "без змін"; exit 0; fi
          git pull --rebase -q origin main
          git push
